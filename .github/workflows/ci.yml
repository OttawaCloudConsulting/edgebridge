name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the ruleset the scan runs against is reproducible.
  BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.7.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Installed from requirements-dev.txt rather than `pip install ruff` so
      # the linter version matches local development. An unpinned install lets
      # a ruff release fail CI on a commit that changed nothing.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=edgebridge --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the git scan needs the full history

      - name: Betterleaks - working tree
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/scan" -w /scan "$BETTERLEAKS_IMAGE" \
            dir . -v --report-format sarif --report-path betterleaks-dir.sarif

      - name: Betterleaks - full git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/scan" -w /scan "$BETTERLEAKS_IMAGE" \
            git . -v --report-format sarif --report-path betterleaks-git.sarif

      # Each report needs its own category. Uploading both under one category
      # is rejected outright ("does not support uploading multiple SARIF runs
      # with the same category") and nothing reaches the Security tab.
      - name: Upload working tree results
        # Runs even when a scan failed, so findings are visible in the
        # Security tab rather than only in the job log.
        if: always()
        continue-on-error: true   # forked PRs cannot write security events
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: betterleaks-dir.sarif
          category: betterleaks-dir

      - name: Upload git history results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: betterleaks-git.sarif
          category: betterleaks-git

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, loaded for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: edgebridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert no config was baked into the image
        # The whole point of the runtime mount. If this ever fails, a build
        # has started shipping credentials inside the image.
        run: |
          docker create --name probe edgebridge:ci
          if docker export probe | tar -t | grep -E 'edgebridge\.cfg|\.registrations'; then
            echo "::error::config or state file found inside the image"
            exit 1
          fi
          echo "confirmed: no config in image"
          docker rm -f probe

      - name: Scan image contents for secrets
        run: |
          docker create --name rootfs edgebridge:ci
          mkdir -p /tmp/rootfs
          # Only our own payload; scanning the whole Python install adds noise
          # from third-party test fixtures without adding signal.
          docker export rootfs | tar -x -C /tmp/rootfs app/ || true
          docker rm -f rootfs
          docker run --rm -v /tmp/rootfs:/scan "$BETTERLEAKS_IMAGE" dir /scan -v

      - name: Smoke test the image
        run: |
          printf '[config]\nServer_Port = 8088\nconsole_output = yes\nlogfile_output = no\n' > /tmp/edgebridge.cfg
          docker run -d --name smoke \
            --read-only \
            --tmpfs /var/lib/edgebridge:uid=10001,gid=10001 \
            -v /tmp/edgebridge.cfg:/etc/edgebridge/edgebridge.cfg:ro \
            -p 8088:8088 edgebridge:ci

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8088/healthz; then
              echo "healthz OK"; break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8088/healthz || { docker logs smoke; exit 1; }

          test "$(docker inspect --format '{{.Config.User}}' edgebridge:ci)" = "10001:10001" \
            || { echo "::error::image does not run as uid 10001"; exit 1; }

          docker stop smoke && docker rm smoke

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: edgebridge:ci
          format: sarif
          output: trivy.sarif
          exit-code: '0'   # reported, not gating: base-image CVEs are often unfixable

      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Verify the multi-arch build
        # arm64 is a release target (Raspberry Pi, arm nodes), so it must be
        # proven buildable on every PR even though nothing is pushed here.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
