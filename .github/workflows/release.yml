name: Release

# Releases are cut by tagging on main. Development happens on develop, which
# only ever produces the unpushed CI build.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.7.0

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tags that are not merged to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::tag ${{ github.ref_name }} is not an ancestor of main; releases are cut from main only"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} is on main"

  validate:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

      - name: Betterleaks - working tree and history
        run: |
          docker run --rm -v "$PWD:/scan" -w /scan "$BETTERLEAKS_IMAGE" dir . -v
          docker run --rm -v "$PWD:/scan" -w /scan "$BETTERLEAKS_IMAGE" git . -v

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release
      packages: write   # to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          # A prerelease (v1.1.0-rc.1) must not take over 'latest'.
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "${{ github.ref_name }}" \
            --notes-start-tag "$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo '')" \
          || gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}"
