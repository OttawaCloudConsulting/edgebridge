networks:
  edgebridgenet:
    name: smarthome_network
    driver: macvlan
    driver_opts:
      parent: eth1
    ipam:
      config:
        - subnet: 192.168.1.0/24      # Enter network subnet range
          gateway: 192.168.1.1        # Enter default gateway

services:
  edgebridge:
    # Build context is the repository root so the Dockerfile can read
    # edgebridge.py and requirements.txt directly. Nothing needs copying
    # into this directory any more.
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      # The config holds your SmartThings bearer token and is mounted at
      # runtime, never baked into the image. Copy edgebridge.cfg.example to
      # edgebridge.cfg and fill it in - the real file is gitignored.
      - './edgebridge.cfg:/etc/edgebridge/edgebridge.cfg:ro'
    ports:
      - "8088:8088"
    dns:
      - 192.168.1.1                   # Enter DNS Server IP
    networks:
      edgebridgenet:
          ipv4_address: 192.168.1.88  # Enter Local/LAN IP Address
    restart: unless-stopped
