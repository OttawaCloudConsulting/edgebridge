# Reference only. The real SealedSecret lives in the project repo.
#
# edgebridge reads a single INI file through configparser, so the whole config
# goes into one Secret key. There is no way to split the non-secret settings
# into a ConfigMap without templating the file at deploy time.
#
# Generate the sealed version from a plain Secret, never commit the plain one:
#
#   kubectl create secret generic edgebridge-config \
#     --from-file=edgebridge.cfg=./edgebridge.cfg \
#     --dry-run=client -o yaml \
#     | kubeseal --format yaml --controller-namespace kube-system \
#     > sealedsecret.yaml
#
# The plaintext this encrypts should look like the block below. Note that
# Server_IP is deliberately absent: setting it to the LoadBalancer address makes
# bind() fail, because the pod does not own that address. Leaving it unset binds
# all interfaces, which is what you want in a pod.
#
#   [config]
#   Server_Port = 8088
#   SmartThings_Bearer_Token = xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#   forwarding_timeout = 5
#   console_output = yes
#   logfile_output = no
#
# console_output = yes sends logs to stdout for `kubectl logs`. Leave
# logfile_output = no: writing a log file inside the container is pointless with
# a read-only root filesystem and invisible to your log collector.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: edgebridge-config
spec:
  encryptedData:
    edgebridge.cfg: AgBy3i4OJSWK+PiTySYZZA9rO4...REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: edgebridge-config
    type: Opaque
