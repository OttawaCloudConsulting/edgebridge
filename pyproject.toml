[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Deliberately close to ruff's defaults. This is a legacy single-file app kept
# close to upstream; a wide rule set would bury real problems under style churn.
# Everything ignored here is pre-existing upstream style, not new code. The
# pyflakes (F) rules stay on, which is what catches genuine mistakes such as
# undefined names and unused imports.
ignore = [
    "E722",  # bare 'except:' - pervasive upstream style, see CLAUDE.md
    "E402",  # imports below the VERSION constant - upstream file layout
    "E711",  # '== None' comparisons - upstream style, semantically fine here
    "F541",  # f-string without placeholders - single upstream occurrence
    "E401",  # multiple imports on one line
    "E701",  # multiple statements on one line
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
]
